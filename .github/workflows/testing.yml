name: Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

# Always force the use of Go modules
env:
  GO111MODULE: on

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout latest code（fetch-depth=0 以支持 --new-from-rev 对比 origin/main）
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Setup the environment.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      # Lint
      # --new-from-rev=origin/main：只检查相对 main 的新增问题，不阻断于历史遗留 lint 债
      - name: Run Linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.11.4
          args: --timeout=10m --new-from-rev=origin/main

      # Compile
      - name: Build server
        run: bash build.sh

      # Run tests
      - name: Run Tests
        run: go test -v -cover ./...

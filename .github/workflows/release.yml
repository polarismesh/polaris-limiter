name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Release polaris limit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin, kubernetes]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
          - goos: kubernetes
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21.0

      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          if [ ${GOOS} == "kubernetes" ];then
            set -e
            cd deploy
            DIR_NAME=polaris-limiter-release_${VERSION}.${GOOS}
            mkdir ${DIR_NAME}
            pushd ${DIR_NAME}
            cp ../kubernetes/* ./
            sed -i "s/##LIMITER_SERVER_VERSION##/${VERSION}/g" 1-polaris-limiter-statefulset.yaml
            popd
            PACKAGE_NAME=${DIR_NAME}.zip
            zip -r ${PACKAGE_NAME} ${DIR_NAME}
            mv ${PACKAGE_NAME} ../
            echo "name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT
          else
            set -e
            echo "version is $VERSION"
            bash build.sh $VERSION
            PACKAGE_NAME=$(ls | grep polaris-limiter-release*.zip | sed -n '1p')
            echo "name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./${{ steps.build.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


apiVersion: v1
kind: ConfigMap
metadata:
  name: polaris-limiter-config
  namespace: polaris-system
data:
  polaris-limiter.yaml: |-
    registry:
      enable: true
      polaris-server-address: {{ 北极星server在k8s中的service-ip或者域名 }}
      name: polaris.limiter
      namespace: Polaris
      health-check-enable: true
      host: $POD_IP              # 注册 IP，由 StatefulSet 通过 downward API 注入
    api-servers:
      - name: http
        register-enabled: false  # HTTP 仅供探针与运维接口，不注册到北极星
        option:
          ip: 0.0.0.0
          port: 8100
      - name: grpc
        register-enabled: true
        option:
          ip: 0.0.0.0
          port: 8101
    limit:
      myid: $MY_ID #节点ID，集群中不同节点需设置不同的myid
      counter-group: 64 # 计数器分组，不同组的计数器创建时不冲突
      max-counter: 1000000
      max-client: 1000
      push-worker: 4
      slide-count: 1
      purge-counter-interval: 30s
      sync-remote-storage-interval: 1m
      async-remote-wait-timeout: 200ms
      update-remote-storage-threshold: 10m
      flush-local-storage-threshold: 3s
    plugin:
      statis:
        name: file
        option:
          ratelimit-app-name: 294_4423_polaris-limiter-stat #限流监控
          ratelimit_report_log_path: log/polaris-limiter-ratelimit-report.log
          ratelimit_event_log_path: log/polaris-limiter-event.log
          ratelimit_precision_log_path: log/polaris-limiter-stat.log
          server-app-name: 294_11866_polaris_limit_server #服务端监控
          server_report_log_path: log/polaris-limiter-server-report.log
          log_interval: 60
          precision_log_interval: 1
    logger:
      RotateOutputPath: log/polaris-limiter.log
      RotationMaxSize: 500
      RotationMaxAge: 30
      RotationMaxBackups: 30     # 500MB × 30 ≈ 15GB，需小于日志卷容量
      level: info
    health:                       # 健康检查。整段不填时全部走默认值。
      iohang:
        enable: true              # 是否启用 IOHang 检测，默认 true
        interval: 5s              # 后台检测周期（定时写探测文件，不由 /readiness 触发）
        timeout: 3s               # 单次写超时阈值，超过即判 DOWN
        staleness: 15s            # 距上次探测完成超过此值判 DOWN；小于 2*interval+timeout 时自动抬高
                                  # 写入立即报错（磁盘满/只读）不算 IOHang，仅在 /readiness details.lastError 展示
        affect-heartbeat: true    # DOWN 时跳过北极星心跳、启动期延迟注册，默认 true
        path: log/polaris-limiter-probe.log  # 独立探测文件，与业务日志同目录
        rotation-max-size: 10     # 探测文件滚动大小（MB），默认 10，远小于业务日志 500
        rotation-max-age: 7       # 探测文件保留天数，默认 7
        rotation-max-backups: 3   # 探测文件备份个数，默认 3

apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: polaris-limiter
  name: polaris-limiter
  namespace: polaris-system
spec:
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: polaris-limiter
  serviceName: polaris-limiter
  template:
    metadata:
      labels:
        app: polaris-limiter
    spec:
      containers:
        - image: polarismesh/polaris-limiter:##LIMITER_SERVER_VERSION##
          imagePullPolicy: Always
          name: polaris-limiter
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: 8100
            - name: grpc
              containerPort: 8101
          # liveness 只探进程存活（无 IO）；readiness 叠加 IOHang 检测，失败只摘流不重启
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: "500m"
              memory: 1000Mi
            limits:
              cpu: "500m"
              memory: 1000Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /root/polaris-limiter.yaml.example
              name: polaris-limiter-config
              subPath: polaris-limiter.yaml
            # 日志与 IOHang 探测文件落在独立数据盘，探测才能反映真实日志盘状态
            - mountPath: /root/log
              name: polaris-limiter-data
              subPath: log
      restartPolicy: Always
      volumes:
        - configMap:
            defaultMode: 0644
            name: polaris-limiter-config
          name: polaris-limiter-config
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
    - metadata:
        name: polaris-limiter-data
      spec:
        accessModes:
          - ReadWriteOnce
        # storageClassName: <按集群填写，不填使用默认 StorageClass>
        resources:
          requests:
            storage: 30Gi
